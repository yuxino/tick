name: Clean demo descriptions
on:
  push:
    branches: [docs/continuous-preview-v3]
    paths: [.github/workflows/clean-demo-copy.yml]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Keep only the feature description and video link
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('README.md');text=p.read_text();pattern=r'<!-- project-demo-v1 -->.*?<!-- /project-demo-v1 -->';assert len(re.findall(pattern,text,re.S))==1
          block='<!-- project-demo-v1 -->\n## 演示\n\n[![Tick](docs/demos/preview.gif)](docs/demos/demo.mp4)\n\n[观看视频](docs/demos/demo.mp4)\n\n设置任务、触发运行，再查看执行结果和日志。\n<!-- /project-demo-v1 -->'
          p.write_text(re.sub(pattern,lambda _:block,text,flags=re.S))
          PY
          git add -- README.md
          git rm -- .github/workflows/clean-demo-copy.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: keep the demo description focused on features'
          git push origin HEAD:refs/heads/docs/continuous-preview-v3
