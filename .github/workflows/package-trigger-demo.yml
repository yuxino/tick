name: Package verified native trigger demo
on:
  push:
    branches: [docs/trigger-demo-v1]
    paths: [.github/workflows/package-trigger-demo.yml]
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 34007989748
          name: tick-native-trigger-review
          path: native-review
      - name: Assemble and verify the reviewed recording
        run: |
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m venv "$RUNNER_TEMP/demo-venv"
          "$RUNNER_TEMP/demo-venv/bin/python" -m pip install Pillow==11.3.0
          "$RUNNER_TEMP/demo-venv/bin/python" -I docs/demos/package-native.py
          python - <<'PY'
          from pathlib import Path
          p=Path('native-deliverables/docs/demos/capture/record-native.py')
          p.write_text(p.read_text(encoding='utf-8'),encoding='utf-8',newline='\n')
          compile(p.read_text(encoding='utf-8'),str(p),'exec')
          PY
      - name: Update only project documentation and remove completed capture scaffolding
        run: |
          python - <<'PY'
          import json,re,shutil,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','branch','--show-current'],text=True).strip()=='docs/trigger-demo-v1'
          source=Path('native-deliverables/docs/demos')
          report=json.loads((source/'native-verification.json').read_text())
          assert report['success'] and report['popup_visible'] and report['popup_foreground'] and report['completion_stdout_verified']
          for p in source.rglob('*'):
              if p.is_file():
                  out=Path('docs/demos')/p.relative_to(source)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(p,out)
          p=Path('README.md');text=p.read_text(encoding='utf-8')
          pattern=r'<!-- project-demo-v1 -->.*?<!-- /project-demo-v1 -->'
          assert len(re.findall(pattern,text,re.S))==1
          block='<!-- project-demo-v1 -->\n## 演示\n\n[![Tick — 演示](docs/demos/preview.gif)](docs/demos/demo.mp4)\n\n[完整视频（MP4）](docs/demos/demo.mp4) · [演示说明](docs/demos/README.md)\n\n配置时间和脚本，点「立即运行」触发提醒弹窗，再到实时日志确认结果。后半段为 **Windows 原生环境实录**；弹窗由示例脚本产生。\n<!-- /project-demo-v1 -->'
          p.write_text(re.sub(pattern,lambda _:block,text,flags=re.S),encoding='utf-8')
          PY
          git rm -- .github/workflows/trigger-demo.yml .github/workflows/package-trigger-demo.yml docs/demos/capture-native-trigger.py docs/demos/inspect-native-ui.py docs/demos/refine-native-trigger.py docs/demos/package-native.py
          git add -- README.md docs/demos
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: show actual task trigger, reminder popup and completion log'
          git push origin HEAD:refs/heads/docs/trigger-demo-v1
      - uses: actions/upload-artifact@v7
        with:
          name: tick-trigger-demo-final
          path: native-deliverables/
          retention-days: 7
          if-no-files-found: error
